[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "press-pull-estimator"
version = "0.1.0"
description = "Press-and-pull non-prehensile estimation of mass, CoM height, and friction (ISRR 2026)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Steven M. Hyland" }, { name = "Jing Xiao" }, { name = "Cagdas D. Onal" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "mujoco>=3.1"]

[project.optional-dependencies]
record = ["imageio[ffmpeg]>=2.31"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["press_pull_estimator*"]
